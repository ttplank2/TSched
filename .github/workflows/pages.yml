name: Publish the browser version

on:
  push:
    branches: [main]
    paths:
      - 'Browser/Apple Version/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The tests run first; if one fails, the live page is left as it was.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Browser/Apple Version'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run behavior

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'Browser/Apple Version'
      - id: deployment
        uses: actions/deploy-pages@v4
